<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#0b5e5a">
  <title>{% block title %}Smart City Portal{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"><link rel="stylesheet" href="{{ url_for('static', filename='admin.css') }}">
</head>
<body>
  <nav class="site-nav navbar navbar-expand-lg"><div class="container"><a class="brand" href="/"><span class="brand-mark">S</span><span>Smart<span>City</span></span></a><button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"><span class="navbar-toggler-icon"></span></button><div class="collapse navbar-collapse" id="mainNav"><div class="navbar-nav ms-auto align-items-lg-center gap-lg-2">{% if session.get("user_id") %}{% if session.get("role") == "admin" %}<a class="nav-link" href="/admin">Dashboard</a>{% else %}<a class="nav-link" href="/dashboard">Dashboard</a><a class="nav-link" href="/my_complaints">My requests</a>{% endif %}<a href="/logout" class="btn btn-nav-outline">Sign out</a>{% else %}<a class="nav-link" href="/login">Sign in</a><a href="/register" class="btn btn-primary btn-nav">Create account</a>{% endif %}</div></div></div></nav>
  <main>{% block body %}{% endblock %}</main>
  <footer class="site-footer"><div class="container d-flex flex-column flex-sm-row justify-content-between gap-2"><span>© 2026 SmartCity Services</span><span>Better services, closer to home.</span></div></footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body></html>
